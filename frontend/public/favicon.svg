<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#090E17"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Squircle Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FBBF24" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Train Body Gradient -->
    <linearGradient id="trainBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F8FAFC"/>
      <stop offset="80%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Windshield Visor Gradient -->
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="25%" stop-color="#0369A1"/>
      <stop offset="70%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Amber Racing Stripe -->
    <linearGradient id="amberStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Headlight Glow Filters -->
    <filter id="glowHeadlight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="signalGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── 1. App Icon Badge Container ────────────────────────── -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#rimGrad)" stroke-width="1.5"/>

  <!-- ── 2. Perspective Railway Tracks ──────────────────────── -->
  <!-- Cross Sleepers (Ties) -->
  <line x1="16" y1="52" x2="48" y2="52" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
  <line x1="11" y1="57" x2="53" y2="57" stroke="#F59E0B" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left & Right Rails -->
  <line x1="21" y1="46" x2="10" y2="60" stroke="#F59E0B" stroke-opacity="0.75" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="43" y1="46" x2="54" y2="60" stroke="#F59E0B" stroke-opacity="0.75" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ── 3. Train Locomotive Body ───────────────────────────── -->
  <!-- Aerodynamic Streamlined Nose & Roof -->
  <path d="M 23 8.5 C 27 6.8 37 6.8 41 8.5 C 46 10.8 47.5 16.5 47.5 23 L 47.5 43.5 C 47.5 45.8 45.2 47.5 42 47.5 L 22 47.5 C 18.8 47.5 16.5 45.8 16.5 43.5 L 16.5 23 C 16.5 16.5 18 10.8 23 8.5 Z"
        fill="url(#trainBodyGrad)"
        stroke="#94A3B8"
        stroke-width="0.5"/>

  <!-- Top Aerodynamic Roof Accent Rib -->
  <path d="M 28 8 C 30 7.3 34 7.3 36 8 L 35.5 12 L 28.5 12 Z" fill="#CBD5E1"/>

  <!-- Top Green Signal Lamp (Confirmed Berth indicator) -->
  <circle cx="32" cy="10.5" r="1.75" fill="#10B981" filter="url(#signalGlow)"/>
  <circle cx="32" cy="10.5" r="0.8" fill="#ECFDF5"/>

  <!-- ── 4. Windshield Glass Visor ──────────────────────────── -->
  <path d="M 23.5 14 C 27.5 12.8 36.5 12.8 40.5 14 C 44 15.5 45 19.5 44.5 24.5 C 44.2 26 43 27 41 27 L 23 27 C 21 27 19.8 26 19.5 24.5 C 19 19.5 20 15.5 23.5 14 Z"
        fill="url(#visorGrad)"/>

  <!-- Windshield Sheen Reflection -->
  <path d="M 25 14 C 28 13.2 30.5 13.2 31.5 13.5 L 28 26.5 L 23.5 26.5 Z" fill="#FFFFFF" fill-opacity="0.22"/>
  <path d="M 37.5 14.5 L 39 15.2 L 35.5 26.5 L 34 26.5 Z" fill="#FFFFFF" fill-opacity="0.12"/>

  <!-- ── 5. Brand Identity: Amber Rail Band ─────────────────── -->
  <path d="M 16.5 31.5 L 47.5 31.5 L 47.5 35.5 L 16.5 35.5 Z" fill="url(#amberStripe)"/>

  <!-- ── 6. Headlights & Cowcatcher Grill ───────────────────── -->
  <!-- Left Headlight -->
  <rect x="18.5" y="37.5" width="4.5" height="3" rx="1.5" fill="#FEF08A" filter="url(#glowHeadlight)"/>
  <rect x="19.25" y="38.25" width="2.5" height="1.5" rx="0.75" fill="#FFFFFF"/>

  <!-- Right Headlight -->
  <rect x="41" y="37.5" width="4.5" height="3" rx="1.5" fill="#FEF08A" filter="url(#glowHeadlight)"/>
  <rect x="41.75" y="38.25" width="2.5" height="1.5" rx="0.75" fill="#FFFFFF"/>

  <!-- Center Searchlight / Seat Emblem -->
  <circle cx="32" cy="38.5" r="2.5" fill="#1E293B"/>
  <circle cx="32" cy="38.5" r="1.5" fill="#F59E0B" filter="url(#glowHeadlight)"/>
  <circle cx="32" cy="38.5" r="0.7" fill="#FFFBEB"/>

  <!-- Cowcatcher / Front Grill Slats -->
  <line x1="24.5" y1="42" x2="39.5" y2="42" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="26.5" y1="44.5" x2="37.5" y2="44.5" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Center Coupler Buffer -->
  <rect x="30" y="46" width="4" height="2" rx="0.8" fill="#334155"/>
</svg>