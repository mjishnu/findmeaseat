[project]
name = "findmeaseat"
version = "1.0.0"
description = "Finds the booking combination most likely to confirm by checking every station pair that covers the user's journey."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "tzdata>=2025.2",
    "rapidfuzz>=3.9.0",
    "redis[hiredis]>=5.0.0",
    "pydantic-settings>=2.0.0",
    "msgpack>=1.1.0",
    "zstandard>=0.23.0",
    "pytest>=8.4.2,<9",
    "pytest-asyncio>=1.2.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
testpaths = ["tests"]
