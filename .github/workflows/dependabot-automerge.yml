name: Dependabot auto-merge

# Sweeps open Dependabot PRs and squash-merges each one whose latest CI/CD run on
# its current head commit succeeded, then starts CI/CD on main to re-test and
# deploy. The explicit dispatch is needed because merges made with GITHUB_TOKEN
# don't trigger push workflows (workflow_dispatch does). Only verified Dependabot
# commits with minor/patch changes are merged; .github/scripts/dependabot_gate.py
# leaves everything else (majors, runtime bumps, range edits, unknown formats)
# open for review. Never checks out or runs PR code.

on:
  workflow_run:
    workflows: [CI/CD]
    types: [completed]
  schedule:
    - cron: "17 3 * * *" # daily catch-up
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: dependabot-automerge
  cancel-in-progress: false

jobs:
  merge:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7 # the default branch, for the gate script only
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Merge Dependabot PRs that passed CI
        run: |
          merged=0
          while read -r pr sha; do
            [ -n "$pr" ] || continue
            ci=$(gh run list --workflow ci-cd.yml --commit "$sha" --event pull_request \
                   --limit 1 --json conclusion --jq '.[0].conclusion // "none"')
            if [ "$ci" != success ]; then
              echo "#$pr: CI/CD on $sha is '$ci'; skipping"
              continue
            fi

            if ! reason=$(gh api "repos/$GH_REPO/commits/$sha" | python3 .github/scripts/dependabot_gate.py); then
              echo "::notice::#$pr left for review: $reason"
              continue
            fi
            title=$(gh pr view "$pr" --json title --jq .title)

            # --match-head-commit: only merge the exact commit CI tested
            if gh pr merge "$pr" --squash --delete-branch --match-head-commit "$sha" \
                 --subject "$title (#$pr)" --body ""; then
              echo "Merged #$pr"
              merged=$((merged + 1))
            else
              echo "::warning::Could not merge #$pr (conflict or updated since CI); Dependabot will rebase it"
            fi
          done < <(gh pr list --state open --app dependabot --limit 100 \
                     --json number,headRefOid --jq '.[] | "\(.number) \(.headRefOid)"')

          if [ "$merged" -gt 0 ]; then
            gh workflow run ci-cd.yml --ref main
            echo "Merged $merged PR(s); started CI/CD on main to test and deploy"
          fi
