name: Dependabot auto-merge

# Sweeps open Dependabot PRs and squash-merges each one whose latest CI/CD run on
# its current head commit succeeded, then starts CI/CD on main to re-test and
# deploy. The explicit dispatch is needed because merges made with GITHUB_TOKEN
# don't trigger push workflows (workflow_dispatch does). Major version bumps (and
# Python/Node runtime minor bumps) are left open for review. Never checks out or
# runs PR code.

on:
  workflow_run:
    workflows: [CI/CD]
    types: [completed]
  schedule:
    - cron: "17 3 * * *" # daily catch-up
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: dependabot-automerge
  cancel-in-progress: false

jobs:
  merge:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Merge Dependabot PRs that passed CI
        run: |
          merged=0
          while read -r pr sha; do
            [ -n "$pr" ] || continue
            ci=$(gh run list --workflow ci-cd.yml --commit "$sha" --event pull_request \
                   --limit 1 --json conclusion --jq '.[0].conclusion // "none"')
            if [ "$ci" != success ]; then
              echo "#$pr: CI/CD on $sha is '$ci'; skipping"
              continue
            fi

            title=$(gh pr view "$pr" --json title --jq .title)
            # "bump X from 1.2.3 to 2.0.0": a major change (or a 0.x minor change) needs
            # review; so does any minor change of the Python/Node runtime images, since
            # CI's tests run on a pinned runtime version
            re='bump ([^ ]+) from v?([0-9]+)\.?([0-9]*)[^ ]* to v?([0-9]+)\.?([0-9]*)'
            if [[ "$title" =~ $re ]]; then
              name=${BASH_REMATCH[1]}
              from_major=${BASH_REMATCH[2]} from_minor=${BASH_REMATCH[3]}
              to_major=${BASH_REMATCH[4]} to_minor=${BASH_REMATCH[5]}
              if [[ $from_major != "$to_major" ]] ||
                 [[ ( $from_major == 0 || $name == python || $name == node ) && $from_minor != "$to_minor" ]]; then
                echo "::notice::#$pr changes $name $from_major.$from_minor -> $to_major.$to_minor; leaving it for review"
                continue
              fi
            fi

            # --match-head-commit: only merge the exact commit CI tested
            if gh pr merge "$pr" --squash --delete-branch --match-head-commit "$sha" \
                 --subject "$title (#$pr)" --body ""; then
              echo "Merged #$pr"
              merged=$((merged + 1))
            else
              echo "::warning::Could not merge #$pr (conflict or updated since CI); Dependabot will rebase it"
            fi
          done < <(gh pr list --state open --app dependabot --limit 100 \
                     --json number,headRefOid --jq '.[] | "\(.number) \(.headRefOid)"')

          if [ "$merged" -gt 0 ]; then
            gh workflow run ci-cd.yml --ref main
            echo "Merged $merged PR(s); started CI/CD on main to test and deploy"
          fi
