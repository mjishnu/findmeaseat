services:
  redis:
    image: redis:8-alpine
    command: >
      redis-server
      --save 60 1
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    restart: unless-stopped

  backend:
    build: ./backend
    expose:
      - "8000"
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      default:
      web_gateway:
        aliases:
          - findmeaseat-frontend

networks:
  default:
  web_gateway:
    external: true

volumes:
  redis_data:
