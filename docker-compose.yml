services:
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    restart: unless-stopped

  backend:
    build: ./backend
    expose:
      - "8000"
    ports:
      - "8000:8000"   # exposed for direct access to /docs; remove if not needed
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
