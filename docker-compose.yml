services:
  backend:
    build: ./backend
    expose:
      - "8000"
    ports:
      - "8000:8000"   # exposed for direct access to /docs; remove if not needed
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
